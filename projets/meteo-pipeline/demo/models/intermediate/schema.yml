version: 2

models:
  - name: int_meteo_unified
    description: "Table unifiee de tous les releves meteorologiques"
    columns:
      - name: station_id
        description: "Identifiant unique de la station"
        tests:
          - not_null
      - name: source
        description: "Source : infoclimat ou weather_underground"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - infoclimat
                  - weather_underground
      - name: temperature_c
        description: "Temperature en degres Celsius"
        tests:
          - not_null